<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Govind — Telegram Bot Developer | Creator | Python & Pyrogram Expert" />
  <meta name="author" content="Govind" />
  <title>GOVIND | Developer Portfolio</title>

  <!-- Favicon -->
  <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/179/179309.png" type="image/x-icon" />

  <!-- Fonts & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700;900&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/js/all.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(-45deg, #0f0c29, #302b63, #24243e, #0f0c29);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
      color: #fff;
      text-align: center;
      overflow: hidden;
      height: 100vh;
      position: relative;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    #particles-js {
      position: absolute;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    .card {
      position: relative;
      top: 50%;
      transform: translateY(-50%);
      width: 90%;
      max-width: 420px;
      margin: auto;
      padding: 30px 25px;
      border-radius: 24px;
      background: rgba(15, 12, 41, 0.55);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 0 50px rgba(138, 43, 226, 0.25);
      z-index: 1;
    }

    .avatar {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      border: 3px solid #a855f7;
      box-shadow: 0 0 30px #a855f7, 0 0 60px rgba(168, 85, 247, 0.4);
      animation: glow 3s infinite alternate;
      object-fit: cover;
    }

    @keyframes glow {
      from { box-shadow: 0 0 15px #a855f7, 0 0 30px rgba(168, 85, 247, 0.3); }
      to   { box-shadow: 0 0 40px #c084fc, 0 0 70px rgba(192, 132, 252, 0.5); }
    }

    /* ====== SUPER COOL NAME ANIMATION ====== */
    .name {
      margin-top: 18px;
      font-size: 2.4rem;
      font-weight: 900;
      letter-spacing: 3px;
      display: flex;
      justify-content: center;
      gap: 4px;
      flex-wrap: wrap;
    }

    .name span {
      display: inline-block;
      background: linear-gradient(90deg, #c084fc, #e879f9, #f0abfc, #c084fc);
      background-size: 300%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: textGlow 4s linear infinite, bounce 2.5s ease-in-out infinite;
    }

    .name span:nth-child(1) { animation-delay: 0.0s; }
    .name span:nth-child(2) { animation-delay: 0.1s; }
    .name span:nth-child(3) { animation-delay: 0.2s; }
    .name span:nth-child(4) { animation-delay: 0.3s; }
    .name span:nth-child(5) { animation-delay: 0.4s; }
    .name span:nth-child(6) { animation-delay: 0.5s; }

    @keyframes textGlow {
      0%   { background-position: 0%; }
      100% { background-position: 300%; }
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0) scale(1); }
      50%      { transform: translateY(-8px) scale(1.08); }
    }

    .tag {
      color: #c4b5fd;
      font-size: 1.05rem;
      margin-top: 6px;
      letter-spacing: 1px;
    }

    .about {
      margin: 14px 0 20px;
      font-size: 0.98rem;
      color: #d1d5db;
      line-height: 1.5;
    }

    .social {
      margin: 18px 0;
    }

    .social a {
      color: #e9d5ff;
      margin: 0 12px;
      font-size: 1.55rem;
      transition: all 0.3s ease;
      display: inline-block;
    }

    .social a:hover {
      color: #c084fc;
      transform: translateY(-5px) scale(1.2);
      text-shadow: 0 0 15px #c084fc;
    }

    .buttons {
      margin-top: 10px;
    }

    .btn {
      display: inline-block;
      padding: 11px 26px;
      border-radius: 12px;
      text-decoration: none;
      color: #fff;
      background: linear-gradient(135deg, #a855f7, #7c3aed);
      margin: 8px;
      font-weight: 600;
      font-size: 0.95rem;
      transition: all 0.3s ease;
      border: none;
    }

    .btn.outline {
      background: transparent;
      border: 2px solid #a855f7;
      color: #e9d5ff;
    }

    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(168, 85, 247, 0.5);
    }

    .btn.outline:hover {
      background: rgba(168, 85, 247, 0.15);
    }

    footer {
      position: absolute;
      bottom: 14px;
      width: 100%;
      text-align: center;
      color: #9ca3af;
      font-size: 0.85rem;
      z-index: 1;
    }

    footer strong {
      color: #c084fc;
    }

    /* Mobile tweaks */
    @media (max-width: 480px) {
      .name { font-size: 2rem; letter-spacing: 2px; }
      .card { padding: 25px 18px; }
    }
  </style>
</head>

<body>
  <!-- Particles Background -->
  <div id="particles-js"></div>

  <!-- Main Card -->
  <div class="card">
    <img src="https://graph.org/file/0471decf208b82b1a9e58.jpg" class="avatar" alt="Govind" />
    
    <!-- Cool animated name -->
    <h1 class="name">
      <span>G</span><span>O</span><span>V</span><span>I</span><span>N</span><span>D</span>
    </h1>

    <p class="tag">@GOVIND-BOTS</p>
    
    <p class="about">
      💻 Telegram Bot Developer | Python | Pyrogram<br>
      ⚡ Building automation with creativity
    </p>

    <div class="social">
      <a href="https://github.com/GOVIND-BOTS" target="_blank"><i class="fab fa-github"></i></a>
      <a href="https://telegram.dog/govind_official_mp13" target="_blank"><i class="fab fa-telegram"></i></a>
      <a href="https://instagram.com/govind__official_mp" target="_blank"><i class="fab fa-instagram"></i></a>
    </div>

    <div class="buttons">
      <a href="https://instagram.com/govind__official_mp" class="btn" target="_blank">Follow</a>
      <a href="https://github.com/GOVIND-BOTS?tab=repositories" class="btn outline" target="_blank">More</a>
    </div>
  </div>

  <footer>⚡ Designed & Animated by <strong>GOVIND</strong></footer>

  <!-- Particles Config -->
  <script>
    particlesJS("particles-js", {
      particles: {
        number: { value: 80, density: { enable: true, value_area: 800 } },
        color: { value: "#c084fc" },
        shape: { type: "circle" },
        opacity: { value: 0.45, random: true },
        size: { value: 3, random: true },
        line_linked: {
          enable: true,
          distance: 140,
          color: "#a855f7",
          opacity: 0.25,
          width: 1
        },
        move: {
          enable: true,
          speed: 1.8,
          direction: "none",
          random: true,
          straight: false,
          out_mode: "out",
          bounce: false
        }
      },
      interactivity: {
        detect_on: "canvas",
        events: {
          onhover: { enable: true, mode: "repulse" },
          onclick: { enable: true, mode: "push" },
          resize: true
        },
        modes: {
          repulse: { distance: 100, duration: 0.4 },
          push: { particles_nb: 4 }
        }
      },
      retina_detect: true
    });
  </script>
</body>
</html>
