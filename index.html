<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Govind — Telegram Bot Developer | Creator | Python & Pyrogram Expert" />
  <meta name="author" content="Govind" />
  <title>GOVIND | Developer Portfolio</title>

  <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/179/179309.png" type="image/x-icon" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700;900&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/js/all.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-gradient: linear-gradient(-45deg, #0f0c29, #302b63, #24243e, #0f0c29);
      --card-bg: rgba(15, 12, 41, 0.55);
      --text-main: #ffffff;
      --text-secondary: #d1d5db;
      --accent: #a855f7;
      --accent-light: #c084fc;
      --tag-color: #c4b5fd;
      --footer-color: #9ca3af;
      --btn-text: #ffffff;
    }

    body.day {
      --bg-gradient: linear-gradient(-45deg, #e0e7ff, #c7d2fe, #a5b4fc, #e0e7ff);
      --card-bg: rgba(255, 255, 255, 0.75);
      --text-main: #1e1b4b;
      --text-secondary: #4b5563;
      --accent: #7c3aed;
      --accent-light: #8b5cf6;
      --tag-color: #6d28d9;
      --footer-color: #6b7280;
      --btn-text: #ffffff;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: var(--bg-gradient);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
      color: var(--text-main);
      text-align: center;
      overflow: hidden;
      height: 100vh;
      position: relative;
      transition: all 0.5s ease;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* ====== BIG ROTATING NAME IN BACKGROUND ====== */
    .bg-name {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 18vw;
      font-weight: 900;
      letter-spacing: 15px;
      white-space: nowrap;
      opacity: 0.08;
      z-index: 0;
      pointer-events: none;
      animation: rotateName 25s linear infinite, colorCycle 8s ease-in-out infinite;
      user-select: none;
    }

    .bg-name-left {
      left: 15%;
      font-size: 14vw;
      opacity: 0.07;
      animation: rotateNameReverse 30s linear infinite, colorCycle 10s ease-in-out infinite;
    }

    .bg-name-right {
      left: 85%;
      font-size: 14vw;
      opacity: 0.07;
      animation: rotateName 28s linear infinite, colorCycle 9s ease-in-out infinite;
    }

    @keyframes rotateName {
      from { transform: translate(-50%, -50%) rotate(0deg); }
      to   { transform: translate(-50%, -50%) rotate(360deg); }
    }

    @keyframes rotateNameReverse {
      from { transform: translate(-50%, -50%) rotate(0deg); }
      to   { transform: translate(-50%, -50%) rotate(-360deg); }
    }

    @keyframes colorCycle {
      0%   { color: #a855f7; }
      33%  { color: #ec4899; }
      66%  { color: #3b82f6; }
      100% { color: #a855f7; }
    }

    body.day .bg-name,
    body.day .bg-name-left,
    body.day .bg-name-right {
      opacity: 0.12;
    }

    #particles-js {
      position: absolute;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    .card {
      position: relative;
      top: 50%;
      transform: translateY(-50%);
      width: 90%;
      max-width: 420px;
      margin: auto;
      padding: 30px 25px;
      border-radius: 24px;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 0 50px rgba(168, 85, 247, 0.25);
      z-index: 2;
      transition: all 0.4s ease;
    }

    body.day .card {
      border: 1px solid rgba(124, 58, 237, 0.2);
      box-shadow: 0 10px 40px rgba(124, 58, 237, 0.15);
    }

    .avatar {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      border: 3px solid var(--accent);
      box-shadow: 0 0 30px var(--accent), 0 0 60px rgba(168, 85, 247, 0.4);
      animation: glow 3s infinite alternate;
      object-fit: cover;
    }

    @keyframes glow {
      from { box-shadow: 0 0 15px var(--accent), 0 0 30px rgba(168, 85, 247, 0.3); }
      to   { box-shadow: 0 0 40px var(--accent-light), 0 0 70px rgba(192, 132, 252, 0.5); }
    }

    .name {
      margin-top: 18px;
      font-size: 2.4rem;
      font-weight: 900;
      letter-spacing: 3px;
      display: flex;
      justify-content: center;
      gap: 4px;
      flex-wrap: wrap;
    }

    .name span {
      display: inline-block;
      background: linear-gradient(90deg, #c084fc, #e879f9, #f0abfc, #c084fc);
      background-size: 300%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: textGlow 4s linear infinite, bounce 2.5s ease-in-out infinite;
    }

    body.day .name span {
      background: linear-gradient(90deg, #7c3aed, #a855f7, #c084fc, #7c3aed);
      background-size: 300%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .name span:nth-child(1) { animation-delay: 0.0s; }
    .name span:nth-child(2) { animation-delay: 0.1s; }
    .name span:nth-child(3) { animation-delay: 0.2s; }
    .name span:nth-child(4) { animation-delay: 0.3s; }
    .name span:nth-child(5) { animation-delay: 0.4s; }
    .name span:nth-child(6) { animation-delay: 0.5s; }

    @keyframes textGlow {
      0%   { background-position: 0%; }
      100% { background-position: 300%; }
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0) scale(1); }
      50%      { transform: translateY(-8px) scale(1.08); }
    }

    .tag {
      color: var(--tag-color);
      font-size: 1.05rem;
      margin-top: 6px;
      letter-spacing: 1px;
    }

    .about {
      margin: 14px 0 20px;
      font-size: 0.98rem;
      color: var(--text-secondary);
      line-height: 1.5;
    }

    .social a {
      color: var(--text-main);
      margin: 0 12px;
      font-size: 1.55rem;
      transition: all 0.3s ease;
      display: inline-block;
      opacity: 0.9;
    }

    .social a:hover {
      color: var(--accent);
      transform: translateY(-5px) scale(1.2);
      text-shadow: 0 0 15px var(--accent);
    }

    .buttons {
      margin-top: 10px;
    }

    .btn {
      display: inline-block;
      padding: 11px 26px;
      border-radius: 12px;
      text-decoration: none;
      color: var(--btn-text);
      background: linear-gradient(135deg, var(--accent), #7c3aed);
      margin: 8px;
      font-weight: 600;
      font-size: 0.95rem;
      transition: all 0.3s ease;
      border: none;
    }

    .btn.outline {
      background: transparent;
      border: 2px solid var(--accent);
      color: var(--text-main);
    }

    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(168, 85, 247, 0.5);
    }

    .btn.outline:hover {
      background: rgba(168, 85, 247, 0.15);
    }

    footer {
      position: absolute;
      bottom: 14px;
      width: 100%;
      text-align: center;
      color: var(--footer-color);
      font-size: 0.85rem;
      z-index: 2;
    }

    footer strong {
      color: var(--accent-light);
    }

    /* Toggle Button */
    .theme-toggle {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 100;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: var(--card-bg);
      border: 2px solid var(--accent);
      color: var(--text-main);
      font-size: 1.3rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      backdrop-filter: blur(10px);
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }

    .theme-toggle:hover {
      transform: scale(1.1);
      box-shadow: 0 0 20px var(--accent);
    }

    @media (max-width: 480px) {
      .name { font-size: 2rem; letter-spacing: 2px; }
      .card { padding: 25px 18px; }
      .bg-name { font-size: 22vw; }
      .bg-name-left, .bg-name-right { font-size: 16vw; }
    }
  </style>
</head>

<body>
  <!-- Big rotating names in background -->
  <div class="bg-name">GOVIND</div>
  <div class="bg-name bg-name-left">GOVIND</div>
  <div class="bg-name bg-name-right">GOVIND</div>

  <!-- Particles -->
  <div id="particles-js"></div>

  <!-- Theme Toggle Button -->
  <button class="theme-toggle" id="themeToggle" title="Toggle Day/Night Mode">
    <i class="fas fa-moon"></i>
  </button>

  <!-- Main Card -->
  <div class="card">
    <img src="https://graph.org/file/0471decf208b82b1a9e58.jpg" class="avatar" alt="Govind" />
    
    <h1 class="name">
      <span>G</span><span>O</span><span>V</span><span>I</span><span>N</span><span>D</span>
    </h1>

    <p class="tag">@GOVIND-BOTS</p>
    
    <p class="about">
      💻 Telegram Bot Developer | Python | Pyrogram<br>
      ⚡ Building automation with creativity
    </p>

    <div class="social">
      <a href="https://github.com/GOVIND-BOTS" target="_blank"><i class="fab fa-github"></i></a>
      <a href="https://telegram.dog/govind_official_mp13" target="_blank"><i class="fab fa-telegram"></i></a>
      <a href="https://instagram.com/govind__official_mp" target="_blank"><i class="fab fa-instagram"></i></a>
    </div>

    <div class="buttons">
      <a href="https://instagram.com/govind__official_mp" class="btn" target="_blank">Follow</a>
      <a href="https://github.com/GOVIND-BOTS?tab=repositories" class="btn outline" target="_blank">More</a>
    </div>
  </div>

  <footer>⚡ Designed & Animated by <strong>GOVIND</strong></footer>

  <script>
    // Particles
    particlesJS("particles-js", {
      particles: {
        number: { value: 70, density: { enable: true, value_area: 800 } },
        color: { value: "#c084fc" },
        shape: { type: "circle" },
        opacity: { value: 0.4, random: true },
        size: { value: 3, random: true },
        line_linked: {
          enable: true,
          distance: 140,
          color: "#a855f7",
          opacity: 0.2,
          width: 1
        },
        move: {
          enable: true,
          speed: 1.6,
          direction: "none",
          random: true,
          straight: false,
          out_mode: "out"
        }
      },
      interactivity: {
        detect_on: "canvas",
        events: {
          onhover: { enable: true, mode: "repulse" },
          onclick: { enable: true, mode: "push" },
          resize: true
        },
        modes: {
          repulse: { distance: 100, duration: 0.4 },
          push: { particles_nb: 3 }
        }
      },
      retina_detect: true
    });

    // Day / Night Mode Toggle
    const toggleBtn = document.getElementById('themeToggle');
    const body = document.body;
    const icon = toggleBtn.querySelector('i');

    // Check saved preference
    if (localStorage.getItem('theme') === 'day') {
      body.classList.add('day');
      icon.classList.remove('fa-moon');
      icon.classList.add('fa-sun');
    }

    toggleBtn.addEventListener('click', () => {
      body.classList.toggle('day');
      
      if (body.classList.contains('day')) {
        icon.classList.remove('fa-moon');
        icon.classList.add('fa-sun');
        localStorage.setItem('theme', 'day');
      } else {
        icon.classList.remove('fa-sun');
        icon.classList.add('fa-moon');
        localStorage.setItem('theme', 'night');
      }
    });
  </script>
</body>
</html>
